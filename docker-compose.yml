version: '3.8'

services:
  coffeeshop_db:
    image: postgres:15.18
    container_name: coffeeshop_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coffeeshop}
    env_file:
      - .env
    volumes:
      - coffeeshop_pgdata:/var/lib/postgresql/data
    networks:
      - default

  dashboard:
    build: .
    container_name: coffeeshop_dashboard
    restart: always
    command: ["pnpm", "--filter", "@coffeeshop/admin-dashboard", "start"]
    ports:
      - "3050:3005"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@coffeeshop_db:5432/${POSTGRES_DB:-coffeeshop}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supers3cr3tc0ffeesh0p}
      PORT: 3005
      INTERNAL_API_URL: http://api:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - coffeeshop_db
    networks:
      - default
      - marketplace_default

  api:
    build: .
    container_name: coffeeshop_api
    restart: always
    command: ["pnpm", "--filter", "@coffeeshop/api", "start"]
    ports:
      - "3051:3001"
      - "10006:10006"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@coffeeshop_db:5432/${POSTGRES_DB:-coffeeshop}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supers3cr3tc0ffeesh0p}
      PORT: 3001
      PRISMA_CLI_BINARY_TARGETS: "debian-openssl-3.0.x"
      UPLOAD_DIR: /app/apps/api/public/uploads
    depends_on:
      - coffeeshop_db
    volumes:
      - coffeeshop_uploads:/app/apps/api/public/uploads
    networks:
      - default
      - marketplace_default

  openwa:
    image: openwa/wa-automate:latest
    container_name: coffeeshop_openwa
    restart: always
    entrypoint: ["/usr/src/app/entrypoint.sh"]
    command: ["--in-docker", "--qr-timeout", "0", "--debug", "--force-port", "--host", "0.0.0.0", "--custom-user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36", "--webhook", "http://api:3001/whatsapp/webhook"]
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      WA_API_KEY: ${WA_API_KEY}
      TZ: Africa/Tunis
    volumes:
      - openwa_data:/sessions
      - ./entrypoint.sh:/usr/src/app/entrypoint.sh:ro
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: coffeeshop_nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/rachma-lite:/usr/share/nginx/html/rachma-lite:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - dashboard
      - api
    networks:
      - default

volumes:
  openwa_data:
  coffeeshop_pgdata:
  coffeeshop_uploads:

networks:
  default:
  marketplace_default:
#    external: true

